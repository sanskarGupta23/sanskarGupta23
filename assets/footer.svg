<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Open channel" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00F0FF"/><stop offset="0.55" stop-color="#2D6BFF"/><stop offset="1" stop-color="#8B3DFF"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/><stop offset="0.25" stop-color="#00F0FF"/>
    <stop offset="0.6" stop-color="#2D6BFF"/><stop offset="0.85" stop-color="#8B3DFF"/><stop offset="1" stop-color="#8B3DFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#0f2f44" stroke-width="1" opacity="0.55"/>
  </pattern>
</defs>
<defs><clipPath id="c"><rect width="1200" height="90" rx="12"/></clipPath></defs>
<g clip-path="url(#c)">
  <rect width="1200" height="90" fill="#04050A"/>
  <rect width="1200" height="90" fill="url(#grid)" opacity="0.7"/>
  <text x="600.0" y="40" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" letter-spacing="8" fill="url(#g)" filter="url(#glow)">OPEN CHANNEL</text>
  <text x="600.0" y="66" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="13" letter-spacing="4" fill="#8fa6c9">CONTACT &amp; COLLABORATION</text>
  <rect x="0" y="87" width="1200" height="3" fill="url(#fade)" filter="url(#soft)"/>
</g>
<rect x="1" y="1" width="1198" height="88" rx="12" fill="none" stroke="url(#g)" stroke-width="1.5" opacity="0.8"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="About Sanskar Gupta: Electronics and Communication Engineering student at VIT Bhopal University, expected 2027. Interested in embedded systems, IoT, electronics and cybersecurity." xmlns:c2pa="http://c2pa.org/manifest">


<svg xmlns="http://www.w3.org/2000/svg" width="590" height="96" viewBox="0 0 590 96" role="img" aria-label="Open Duck Playground — Private repository">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00F0FF"/>
    <stop offset="0.55" stop-color="#2D6BFF"/>
    <stop offset="1" stop-color="#8B3DFF"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07101c"/>
    <stop offset="1" stop-color="#0b0716"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#0f2f44" stroke-width="1" opacity="0.55"/>
  </pattern>
  <clipPath id="c"><rect width="590" height="96" rx="12"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="590" height="96" fill="url(#panel)"/>
  <rect width="590" height="96" fill="url(#grid)" opacity="0.7"/>
  <rect width="5" height="96" fill="url(#g)" filter="url(#soft)"/>
  <g filter="url(#glow)">
    <path d="M44 28L64 48L44 68L24 48Z" fill="#04050A" stroke="url(#g)" stroke-width="2.5"/>
    <circle cx="44" cy="48" r="3.5" fill="#fff"/>
  </g>
  <text x="88" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="2.1" fill="url(#g)" filter="url(#glow)">OPEN_DUCK_PLAYGROUND</text>
  <text x="90" y="72" font-family="Courier New,monospace" font-size="13" letter-spacing="1" fill="#8fa6c9">PRIVATE REPOSITORY // ACCESS RESTRICTED</text>
  <g transform="translate(530,27)" filter="url(#soft)" stroke="#00F0FF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="17" width="27" height="22" rx="4"/>
    <path d="M9 17V11a7.5 7.5 0 0 1 15 0v6"/>
    <circle cx="16.5" cy="27" r="2" fill="#00F0FF" stroke="none"/>
    <path d="M16.5 29v4"/>
  </g>
</g>
<rect x="1" y="1" width="588" height="94" rx="12" fill="none" stroke="url(#g)" stroke-width="1.5" opacity="0.9"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Sanskar Gupta - Engineering Project Archive" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00F0FF"/><stop offset="0.55" stop-color="#2D6BFF"/><stop offset="1" stop-color="#8B3DFF"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/><stop offset="0.25" stop-color="#00F0FF"/>
    <stop offset="0.6" stop-color="#2D6BFF"/><stop offset="0.85" stop-color="#8B3DFF"/><stop offset="1" stop-color="#8B3DFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#0f2f44" stroke-width="1" opacity="0.55"/>
  </pattern>
</defs>
<defs>
  <radialGradient id="rg1" cx="0.1" cy="0" r="0.7"><stop offset="0" stop-color="#00F0FF" stop-opacity="0.22"/><stop offset="1" stop-color="#00F0FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="rg2" cx="0.95" cy="1" r="0.7"><stop offset="0" stop-color="#8B3DFF" stop-opacity="0.30"/><stop offset="1" stop-color="#8B3DFF" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="1200" height="320" rx="14"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="320" fill="#04050A"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#rg1)"/>
  <rect width="1200" height="320" fill="url(#rg2)"/>
  <rect x="0" y="-60" width="1200" height="60" fill="#00F0FF" opacity="0.07">
    <animate attributeName="y" from="-60" to="320" dur="5s" repeatCount="indefinite"/>
  </rect>
  <g font-family="'Courier New',Consolas,monospace" font-size="13" letter-spacing="3" fill="#00F0FF" opacity="0.85">
    <text x="48" y="58">[ ENGINEERING PROJECT ARCHIVE ]</text>
    <text x="1152" y="58" text-anchor="end"><tspan fill="#00F0FF">SYS.STATUS</tspan><tspan fill="#7be8ff"> // ONLINE</tspan></text>
  </g>
  <text x="600.0" y="165" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="10" fill="url(#g)" filter="url(#glow)">SANSKAR GUPTA</text>
  <g font-family="'Courier New',Consolas,monospace" font-size="16" letter-spacing="4" text-anchor="middle">
    <text x="600.0" y="212" fill="#9fb4d6">ELECTRONICS &amp; COMMUNICATION ENGINEERING</text>
  </g>
  <rect x="48" y="258" width="1104" height="2" fill="url(#fade)" filter="url(#soft)"/>
  <circle r="4" cy="259" fill="#fff" filter="url(#glow)">
    <animate attributeName="cx" from="48" to="1152" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g font-family="'Courier New',Consolas,monospace" font-size="12" letter-spacing="3" fill="#6f86ad">
    <text x="48" y="290">PROJECTS &amp; EXPERIMENTS</text>
    <text x="1152" y="290" text-anchor="end">LEARNING // BUILDING // EXPLORING</text>
  </g>
</g>
<rect x="1" y="1" width="1198" height="318" rx="14" fill="none" stroke="url(#g)" stroke-width="1.5" opacity="0.8"/>
<g fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#soft)" opacity="0.9">
  <path d="M14 40V14H40"/><path d="M1160 14H1186V40"/>
  <path d="M14 280V306H40"/><path d="M1160 306H1186V280"/></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>